AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ai-pollution-optimizer
  SAM Template for the backend of AI Personal Pollution Optimizer

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        TABLE_NAME: !Ref TripsTable
        DEMO_MODE: 'false'
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"

Resources:
  TripsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ai-pollution-optimizer-trips
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: tripId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: tripId
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  OptimizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/optimize.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TripsTable
      Events:
        Optimize:
          Type: Api
          Properties:
            Path: /api/optimize
            Method: post

  EnvironmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/environment.handler
      Events:
        Environment:
          Type: Api
          Properties:
            Path: /api/environment
            Method: get

  TripAcceptFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/trip.acceptHandler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TripsTable
      Events:
        TripAccept:
          Type: Api
          Properties:
            Path: /api/trip/accept
            Method: post

  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/dashboard.dashboardHandler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TripsTable
      Events:
        Dashboard:
          Type: Api
          Properties:
            Path: /api/dashboard
            Method: get

  ImpactFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/dashboard.impactHandler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TripsTable
      Events:
        Impact:
          Type: Api
          Properties:
            Path: /api/impact
            Method: get

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/api/"
