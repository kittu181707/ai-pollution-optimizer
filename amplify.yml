version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - cd frontend
        - npm install
        - npm audit --audit-level=high
    build:
      commands:
        - npm run test:ui
        - npm run typecheck
        - npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
