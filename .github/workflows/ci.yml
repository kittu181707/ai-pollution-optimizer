name: ci
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Backend
        run: |
          cd backend
          npm install
          npm audit --audit-level=high
          npm run typecheck
          npm test
      - name: Frontend
        run: |
          cd frontend
          npm install
          npm audit --audit-level=high
          npm run typecheck
          npm run build
