name: ci
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Root workspace
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          node -e "const root=require('./package.json'); const backend=require('./backend/package.json'); if(!backend.scripts?.dev || !root.scripts?.dev?.includes('npm run dev --prefix backend')) process.exit(1)"
      - name: Backend
        run: |
          cd backend
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm test
      - name: Frontend
        run: |
          cd frontend
          npm install
          npm audit --audit-level=high
          npm run test:ui
          npm run typecheck
          npm run build
          test -z "$(git ls-files '*.tsbuildinfo')"
